# The 48 prompts from OneTrainer/lora_dataset_generation_prompts.txt for Load Prompt List (YAML), with the targets
# Reference Analyzer ranks photos against. Fix a target by hand when it doesn't match what the prompt asks for.
#   width/height for local models, aspect for API nodes with an aspect_ratio dropdown (Meta Muse Image Edit).
#   crop:        eyes | face_detail | ear | hands | hand_face | feet | head_shoulders | medium | cowboy | middle_full | full | wide
#   angle:       front | three_quarter | profile | rear | any
#   side:        left | right, the frame direction the face points (optional)
#   camera:      eye_level | high | low
#   gaze:        camera | away | down | closed | any
#   posture:     standing | seated | walking | jumping | any
#   light:       short description, matched with CLIP
#   light_side:  left | right | even (checked on the face) or front | back | both | any (not checked)
#   environment: short description, matched with CLIP
# T1/T2 (tattoo / mark) are left out, add them once [MARK] is filled in.

prompts:
- id: '01'
  title: Extreme close-up - left eye
  width: 1024
  height: 1024
  aspect: '1:1'
  crop: eyes
  angle: front
  camera: eye_level
  gaze: camera
  posture: any
  light: soft diffused window light
  light_side: left
  environment: macro close-up of an eye
  prompt: >-
    Using the attached reference photos, create a photorealistic photograph of the same person. They are the only person in
    the references with a visible face; ignore anyone whose face is whited out. Preserve their exact facial features, eye
    shape, eye color, skin tone, skin texture and natural hair color. Reproduce a freckle, mole or other skin mark only if
    it is clearly visible in the same place in several of the reference photos. Do not add marks that are faint, appear in
    only one photo, or could be blur, noise or compression artifacts; render that skin as clear, natural skin. Macro extreme
    close-up of the person's left eye filling the frame, including the eyebrow and the upper cheek, looking straight into
    the lens. Bare skin with no makeup. Soft diffused window light from the left, with a crisp catchlight in the iris. Razor-sharp
    focus on the iris and lashes, natural pore-level skin texture, 100mm macro lens. Only this one person, no text, no watermark,
    no white face patches.
  caption: >-
    Extreme close-up of TRIGGER's left eye and eyebrow, looking directly at the camera. Soft diffused window light from the
    left.
